<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <title>Reports - Scamguard</title>
    
    <!-- Accessibility settings check -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('scamguardAccessibilitySettings')
                    || localStorage.getItem('accountAccessibilitySettings');
                if (!saved) return;
                var settings = JSON.parse(saved);
                if (settings.monospace) document.documentElement.setAttribute('data-a11y-font', 'mono');
                if (settings.disableBackground) document.documentElement.setAttribute('data-a11y-starfield-disabled', 'true');
                if (settings.reduceMotion) document.documentElement.setAttribute('data-a11y-reduce-motion', 'true');
            } catch (e) {
                // Ignore malformed values and continue with defaults.
            }
        })();
    </script>
</head>
<body>
    <div id="stars" aria-hidden="true"></div>
    <div id="stars2" aria-hidden="true"></div>
    <div id="stars3" aria-hidden="true"></div>
    <nav>
        <div class="logo">
            <i class="fa-solid fa-code"></i>
        </div>
        <div class="links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="reports.html" class="active nav-link">Search</a>
            <a href="learn.html" class="nav-link">Learn</a>
            <a href="report.html" class="nav-link">Submit Report</a>
        </div>
    </nav>

    <main class="report-container">
        <h1>View All Reports</h1>
        <p>Search and explore reported scams to stay informed</p>

        <!-- Search & Filter Section -->
        <div class="search-section reports-search-grid">
            <div class="form-group reports-search-field">
                <label for="typeFilter">Scam Type</label>
                <select id="typeFilter">
                    <option value="">-- All Types --</option>
                    <option value="phishing">Phishing Scam</option>
                    <option value="tech-support">Tech Support Fraud</option>
                    <option value="romance">Romance Scam</option>
                    <option value="lottery">Lottery & Prize Scam</option>
                    <option value="identity-theft">Identity Theft</option>
                    <option value="cryptocurrency">Cryptocurrency Scam</option>
                    <option value="job-offer">Job Offer Scam</option>
                    <option value="fake-website">Fake Website & Impersonation</option>
                    <option value="social-media">Social Media Scam</option>
                    <option value="auction">Auction & Marketplace Fraud</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group reports-search-field">
                <label for="searchInput">Search</label>
                <input type="text" id="searchInput" placeholder="Company, website, title...">
            </div>
            <button id="searchBtn" class="btn btn-submit reports-search-btn">
                <i class="fas fa-search"></i> Search
            </button>
            <button id="refreshBtn" class="btn btn-reset reports-search-btn">
                <i class="fas fa-sync-alt"></i> Reset
            </button>
        </div>

        <!-- Results Table -->
        <div id="resultsContainer" class="reports-results-wrap">
            <table id="resultsTable" class="reports-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Scam Type</th>
                        <th>Risk Score</th>
                        <th>Scammer Name</th>
                        <th>Reported By</th>
                        <th>Date</th>
                        <th>Evidence</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="7" class="reports-loading-cell">Loading reports...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Report Detail Modal -->
    <div id="reportModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title-section">
                    <div class="modal-title">
                        <span class="type-badge" id="modalType"></span>
                        <h2 id="modalTitle"></h2>
                    </div>
                </div>
                <button class="close-modal" onclick="closeReportModal()">✕</button>
            </div>

            <div class="modal-field">
                <label>Scammer Name / Company</label>
                <div class="modal-field-value" id="modalScammerName"></div>
                <div class="modal-website" id="modalWebsite"></div>
            </div>

            <div class="modal-field">
                <label>Description</label>
                <div class="modal-field-value" id="modalDescription"></div>
            </div>

            <div class="modal-field">
                <label>Reporter Info</label>
                <div class="modal-field-value">
                    <strong id="modalReporter"></strong> • <span id="modalDate"></span>
                </div>
            </div>

            <div id="aiAnalysisSection" class="ai-analysis-section"></div>

            <div class="evidence-section" id="evidenceSection">
                <label>Evidence Files</label>
                <div class="evidence-list" id="evidenceList"></div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="site-footer-inner">
            <a href="privacy.html">Privacy Policy</a>
            <span aria-hidden="true">|</span>
            <a href="https://github.com/ScamGuard-App/scamguard-main" target="_blank" rel="noopener noreferrer">Source Code</a>
            <span aria-hidden="true">|</span>
            <span class="site-footer-copy">ScamGuard, 2026</span>
        </div>
    </footer>

    <!-- Load bg, supabase & accessibility -->
    <script src="js/starfield.js"></script>
    <script src="js/accountAccessibility.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/supabase.public.js?v=20260311"></script>
    <script type="module" src="js/nav.js?v=20260309"></script>
    <script type="module" src="js/reports.js?v=20260309"></script>
</body>
</html>
